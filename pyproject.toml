[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neural-ecg"
version = "0.1.0"
description = "Classical and learned ECG processing on the MIT-BIH Arrhythmia Database: QRS detection and inter-patient heartbeat classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "wfdb>=4.1,<5",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
neural = ["torch==2.9.1"]

[tool.uv]
exclude-newer = "2026-04-01T22:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_ecg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".uv-python", ".runtime", ".pytest-tmp", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
